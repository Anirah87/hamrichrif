      * {

    padding: 0;
    box-sizing: border-box;

  :root {
    --top-bg: #32373c;
    --bottom-bg: #18191c;
    --lightblack: #515c6f;
    --white: #ffffff;
    --lightbshadow: rgba(0, 0, 0, 0.15);
    --main-color: #009bff;
  }
 
  body{
  display: flex;
  align-items: center;
  justify-content: center;
  height: 650px;
  background: rgb(207, 207, 207);
}

.container{
  width: 350px;
  height: 750px;
  padding: 25px 30px;
  overflow: hidden;
  position: relative;
  border-radius: 15px;
  background: linear-gradient(#9ce3ff 0%, #fd878d 90%);
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.342);
   background-blend-mode: screen;
}


  .container i {
    cursor: pointer;
  }
  .top-bar,
  .progress-area .song-timer,
  .controls,
  .music-list .header,
  .music-list ul li {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar i {
    font-size: 50px;
    color: var(--lightblack);
  }
  .top-bar i:first-child {
    margin-left: -7px;
  }
  .top-bar span {
    font-size: 33px;
    margin-left: -3px;
    color: var(--lightblack);
  }
.img-area{
  width: 100%;
  height: 280px;
  overflow: hidden;
  margin-top: 15px;
  border-radius: 50%;
  border-radius: 50%;
	box-shadow: 0 0 0 5px #ffffff,
	0 0 2px #fff,
	13px 13px 20px #31313163,
	-10px -10px 20px #e6f6ff;

}
.img-area img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  
}
  .song-details{
  text-align: center;
  margin: 10px 0;
}
.song-details p{
  color: #ffffff;
}
.song-details .name{
  font-size: 26px;
}
.song-details .artist{
  font-size: 25px;
  opacity: 0.9;
  line-height: 35px;
  color: #32373c;
}
.progress-area{
  height: 6px;
  width: 100%;
  border-radius: 50px;
  background: #f0f0f081;
  cursor: pointer;
}
.progress-area .progress-bar{
  
  height: inherit;
  width: 0%;
  position: relative;
  border-radius: inherit;
  background: #ffffff;
}
.progress-bar::before{
  content: "";
  position: absolute;
  height: 12px;
  width: 12px;
  border-radius: 50%;
  top: 50%;
  right: -5px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-50%);
  background: inherit;
  transition: opacity 0.2s ease;
}
.progress-area:hover .progress-bar::before{
  opacity: 1;
  pointer-events: auto;
}
.progress-area .song-timer{
  margin-top: 0px;
}
.song-timer span{
  font-size: 13px;
  color: #ffffff;
}
.controls{
  margin: 70px 0 5px 0;
}
.controls i{
  font-size: 28px;
  user-select: none;
  background:#ffffff;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.controls i:nth-child(2),
.controls i:nth-child(4){
  font-size: 43px;
}
.controls #prev{
  margin-right: -13px;
}

.controls #next{
  margin-left: -13px;
}

.controls i.prev{
  font-size: 38px;
  }
  .controls i.next{
    font-size: 38px;
    }

.controls .play-pause{
  height: 54px;
  width: 54px;
  display: flex;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: 
	0 0 2px #fff,
	8px 8px 15px #ff5e66,
	-3px -3px 15px #f0ecec	
	;
 
}
.play-pause::before{
  position: absolute;
  content: "";
  height: 43px;
  width: 43px;
  border-radius: inherit;
  background: transparent;
  border: 3px solid #ffffff;
}
.play-pause i{
  height: 43px;
  width: 43px;
  line-height: 43px;
  text-align: center;
  background: inherit;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: white;
  position: absolute;
  
}
.prev , .next {
  box-shadow: 
	0 0 2px #fff,
	8px 8px 15px #ff5e66,
	-3px -3px 15px #f0ecec;
  border-radius: 50%;
}
  .music-list {
    position: absolute;
    background: var(--white);
    width: 100%;
    left: 0;
    bottom: -55%;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    padding: 15px 30px;
    border-radius: 15px;

  .music-list.show {

  }
  ul li .audio-duration {
    font-size: 16px;
  }
  ul li.playing {
    pointer-events: none;
    color: var(--bottom-bg);
  }

    <script>const container = document.querySelector(".container"),
      musicImg = container.querySelector(".img-area img"),
      musicName = container.querySelector(".song-details .name"),
      musicArtist = container.querySelector(".song-details .artist"),
      playPauseBtn = container.querySelector(".play-pause"),
      prevBtn = container.querySelector("#prev"),
      nextBtn = container.querySelector("#next"),
      mainAudio = container.querySelector("#main-audio"),
      progressArea = container.querySelector(".progress-area"),
      progressBar = progressArea.querySelector(".progress-bar");
    
    let musicIndex = 0;
    let isPlaying = false;
    
    window.addEventListener("load", () => {
      loadMusic(musicIndex);
    });
    function loadMusic(indexNumb) {
      musicName.innerHTML = allMusic[indexNumb].name;
      musicArtist.innerText = allMusic[indexNumb].artist;
      musicImg.src = allMusic[indexNumb].img;
      mainAudio.src = allMusic[indexNumb].src;
    }
    function playMusic() {
      isPlaying = true;
      playPauseBtn.querySelector("i").innerHTML = "pause";
    
      mainAudio.play();
    }
    function pauseMusic() {
      isPlaying = false;
      playPauseBtn.querySelector("i").innerHTML = "play_arrow";
    
      mainAudio.pause();
    }
    playPauseBtn.addEventListener("click", () => {
      isPlaying ? pauseMusic() : playMusic();
    });
    
    function nextMusic() {
      musicIndex++;
      musicIndex > allMusic.length - 1
        ? (musicIndex = 0)
        : (musicIndex = musicIndex);
      loadMusic(musicIndex);
      playMusic();
    }
    
    nextBtn.addEventListener("click", () => {
      nextMusic();
    });
    function prevMusic() {
      musicIndex--;
      musicIndex < 0
        ? (musicIndex = allMusic.length - 1)
        : (musicIndex = musicIndex);
      loadMusic(musicIndex);
      playMusic();
    }
    prevBtn.addEventListener("click", () => {
      prevMusic();
    });
    const repeatBtn = container.querySelector("#repeat-plist");
    
    repeatBtn.addEventListener("click", () => {
      let getText = repeatBtn.innerHTML;
      switch (getText) {
        case "repeat":
          repeatBtn.innerHTML = "repeat_one";
          repeatBtn.setAttribute("title", "Song looped");
          break;
        case "repeat_one":
          repeatBtn.innerHTML = "shuffle";
          repeatBtn.setAttribute("title", "Playback shuffled");
          break;
        case "shuffle":
          repeatBtn.innerHTML = "repeat";
          repeatBtn.setAttribute("title", "Playlist looped");
          break;
      }
    });
    mainAudio.addEventListener("ended", () => {
      let getText = repeatBtn.innerText;
      switch (getText) {
        case "repeat":
          nextMusic();
          break;
        case "repeat_one":
          mainAudio.currentTime = 0;
          loadMusic(musicIndex);
          playMusic();
          break;
        case "shuffle":
          let randIndex = Math.floor(Math.random() * allMusic.length);
          do {
            randIndex = Math.floor(Math.random() * allMusic.length);
          } while (musicIndex == randIndex);
          {
            musicIndex = randIndex;
            loadMusic(musicIndex);
            playMusic();
            break;
          }
      }
    });
    mainAudio.addEventListener("timeupdate", (e) => {
      const currentTime = e.target.currentTime;
      const duration = e.target.duration;
      let progressWidth = (currentTime / duration) * 100;
      progressBar.style.width = `${progressWidth}%`;
      let musicCurrentTime = container.querySelector(".current-time"),
        musicDuration = container.querySelector(".max-duration");
    
      mainAudio.addEventListener("loadeddata", () => {
        const interval = setInterval(() => {
          const _elapsed = mainAudio.currentTime;
          musicCurrentTime.innerHTML = formatTime(_elapsed);
        }, 1000);
        const _duration = mainAudio.duration;
        musicDuration.innerHTML = formatTime(_duration);
        mainAudio.addEventListener("ended", () => {
          clearInterval(interval);
        });
      });
    });
    progressArea.addEventListener("click", (e) => {
      let progressWidth = progressArea.clientWidth;
      let clickedOffsetX = e.offsetX;
      let songDuration = mainAudio.duration;
    
      mainAudio.currentTime = (clickedOffsetX / progressWidth) * songDuration;
      playMusic();
    });
    
    function formatTime(time) {
      if (time && !isNaN(time)) {
        const minutes =
          Math.floor(time / 60) < 10
            ? `0${Math.floor(time / 60)}`
            : Math.floor(time / 60);
        const seconds =
          Math.floor(time % 60) < 10
            ? `0${Math.floor(time % 60)}`
            : Math.floor(time % 60);
        return `${minutes}:${seconds}`;
      }
      return "00:00";
    }
